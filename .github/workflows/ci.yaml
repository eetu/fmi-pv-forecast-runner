name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: "Python"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python from .python-version
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Smoke import check
        run: uv run python -c "import fmi_pv_forecaster; import run"

  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: false
          load: true
          tags: fmi-pv-forecast-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify entrypoint
        run: docker run --rm --entrypoint python fmi-pv-forecast-runner:ci -c "import fmi_pv_forecaster; import run; print('ok')"
